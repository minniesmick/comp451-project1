<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Model Lab</title>
<link rel="icon" href="data:,">
<script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="mast">
<div class="top">
  <div class="brand">
    <img class="logo" src="mef-logo.png" alt="MEF University" width="62" height="44">
    <div>
      <h1>Model Lab</h1>
      <p>Tweet sentiment · three transformers · three tokenizers</p>
    </div>
  </div>
  <div class="tools">
  <nav class="tabs" role="tablist" aria-label="Sections">
    <span class="ink" aria-hidden="true"></span>
    <button role="tab" data-tab="compare" aria-selected="true">Compare</button>
    <button role="tab" data-tab="train" aria-selected="false">Training</button>
    <button role="tab" data-tab="tokens" aria-selected="false">Tokenizers</button>
    <button role="tab" data-tab="attention" aria-selected="false">Attention</button>
    <button role="tab" data-tab="live" aria-selected="false">Try it</button>
    <button role="tab" data-tab="errors" aria-selected="false">Test set</button>
  </nav>
  <button class="theme" id="theme" type="button" aria-label="Switch light / dark theme" title="Light / dark">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  </div>
</div>
</header>

<main>
  <section id="tab-compare" class="panel" role="tabpanel"></section>
  <section id="tab-train" class="panel" role="tabpanel" hidden></section>
  <section id="tab-tokens" class="panel" role="tabpanel" hidden></section>
  <section id="tab-attention" class="panel" role="tabpanel" hidden></section>
  <section id="tab-live" class="panel" role="tabpanel" hidden></section>
  <section id="tab-errors" class="panel" role="tabpanel" hidden></section>
</main>
<footer class="foot">
  <span><b>COMP 451</b> · Project#1 · Fall 2026</span>
  <span>Instructor: Dr. Demir</span>
  <span>Student: Alper Yusuf Yaman</span>
  <span class="dim">MEF University course project, unofficial. Logo and name belong to MEF University.</span>
</footer>
<div id="tip" class="tip" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
